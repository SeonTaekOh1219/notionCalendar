name: Sync Notion to Google Calendar

on:
  schedule:
    # UTC 기준이지만 N분마다는 시간대와 무관하다.
    # 10분 간격. 공개 저장소라 Actions 사용 시간이 무제한이다.
    # 비공개로 되돌리면 월 4,320분이 되어 무료 한도(2,000분)를 넘으므로
    # 그때는 */30 으로 되돌려야 한다.
    # GitHub cron은 부하에 따라 지연·누락될 수 있어 실제 간격은 더 벌어진다.
    - cron: "*/10 * * * *"
  # Actions 탭에서 손으로 즉시 실행할 수 있게 해준다
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call sync endpoint
        run: |
          status=$(curl -sS --max-time 120 \
            -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SYNC_URL }}")

          echo "HTTP $status"
          cat response.json
          echo

          if [ "$status" != "200" ]; then
            echo "::error::동기화 실패 (HTTP $status)"
            exit 1
          fi

          # 코드가 개별 항목 실패를 failed 카운트로 돌려주므로, 그것도 실패로 본다
          if grep -q '"failed":[1-9]' response.json; then
            echo "::error::일부 일정 동기화 실패"
            exit 1
          fi